  # ============================================================================================
  # subfields.parquet -- institution x subfield, bestfit tree only, G6 floor on si
  # ============================================================================================
  subfields.parquet:
    grain: "institution x subfield (252 subfields), tree=bestfit only; by-year string columns dropped (derivable from topics_all)"
    keys: [institution_id, subfield_id, tree]
    columns:
      - {name: inst_key, dtype: int32, meaning: null}
      - {name: institution_id, dtype: object, meaning: null}
      - {name: subfield_id, dtype: int16, meaning: "OpenAlex subfield id"}
      - {name: field_id, dtype: int16, meaning: "parent field id; nesting is fixed, never re-derived per tree (derive.py)"}
      - {name: tree, dtype: category, meaning: "always 'bestfit' in the shipped file (verified)"}
      - {name: vol_frac, dtype: float32, meaning: "fractional work-mass in this subfield"}
      - {name: vol_full, dtype: int32, meaning: "full work count in this subfield"}
      - {name: share_frac, dtype: float32, meaning: "vol_frac / SUM(vol_frac) over this institution's subfields in this scenario. VERIFIED: sums to 1 per institution, max|sum-1| = 1.19e-7 (float32; compare float64)."}
      - {name: share_full, dtype: float32, meaning: "vol_full / SUM(vol_full) over this institution's subfields in this scenario. VERIFIED: sums to 1 per institution, max|sum-1| = 1.19e-7."}
      - {name: si, dtype: float32, meaning: "share_frac / mean(share_frac over institutions with nonzero vol_frac in that subfield, same tree) -- NaN when vol_frac < 30 (G6 floor, config.yaml g6_impact_floor lineage / l2_si_floor.value=30, pipeline/agg/trees_agg.G6_FLOOR). VERIFIED 2026-08-29: of 770,871 rows, 729,417 have vol_frac<30 and ALL 729,417 have si=NaN; the remaining 41,454 rows (vol_frac>=30) ALL have a defined si. The floor is on vol_frac (fractional mass, '~100 full works' per derive.py), applied REGARDLESS of which basis (frac/full) is displayed (derive.py 'BASIS GENERALIZATION' note). This IS the floored table -- contrast with fields.si above, which has no floor."}

  # ============================================================================================
  # topics_all.parquet -- institution x topic (topic-grain master, "all touched")
  # ============================================================================================
  topics_all.parquet:
    grain: "institution x topic, every topic the institution has ANY mass in (sparse; 3,359,330 rows). This is the one topic-grain master pipeline/agg/derive.py derives every tree x basis scenario's fields/subfields shapes from."
    keys: [institution_id, topic_id]
    columns:
      - {name: inst_key, dtype: int32, meaning: null}
      - {name: institution_id, dtype: object, meaning: null}
      - {name: topic_id, dtype: object, meaning: "OpenAlex topic id (topics_dim.topic_id); the taxonomy-repaired assignment already reflects assignment=primary (config.yaml)"}
      - {name: share_frac, dtype: float32, meaning: "vol_frac / SUM(vol_frac) over ALL topics touched by this institution (topic grain, not subfield-grain). VERIFIED 2026-08-29: max abs diff between share_frac and a live recomputation from vol_frac = 9.3e-10 (float32 noise)."}
      - {name: vol_frac, dtype: float32, meaning: "fractional work-mass on this topic. VERIFIED: SUM(vol_frac) over an institution's rows equals that institution's index.total_frac."}
      - {name: vol_full, dtype: int32, meaning: "full work count on this topic, full corpus window"}
      - {name: vol_full_2020, dtype: int16, meaning: "full work count, year 2020"}
      - {name: vol_frac_2020, dtype: float32, meaning: "fractional work count, year 2020"}
      - {name: vol_full_2021, dtype: int16, meaning: null}
      - {name: vol_frac_2021, dtype: float32, meaning: null}
      - {name: vol_full_2022, dtype: int16, meaning: null}
      - {name: vol_frac_2022, dtype: float32, meaning: null}
      - {name: vol_full_2023, dtype: int16, meaning: null}
      - {name: vol_frac_2023, dtype: float32, meaning: null}
      - {name: vol_full_2024, dtype: int16, meaning: null}
      - {name: vol_frac_2024, dtype: float32, meaning: null}
      - {name: vol_full_2025, dtype: int16, meaning: "2025 is the labeled BONUS year (config.yaml bonus_year): trends/volume only, excluded from impact indicators (R1.6 composition skew)"}
      - {name: vol_frac_2025, dtype: float32, meaning: null}
    trend_slices: "subfield x year and topic x year trend lines are DERIVABLE in-app by summing vol_full_<year>/vol_frac_<year> over topics_dim.subfield_id joined on topic_id -- see derived_views below and ARTEFACT_GAP_AUDIT.md (field-level trajectories are NOT derivable: fields.parquet and derive.py's fields_df never carry by-year columns)."

  # ============================================================================================
  # topics_dim.parquet -- topic dictionary (4,516 OpenAlex topics)
  # ============================================================================================
  topics_dim.parquet:
    grain: "one row per OpenAlex topic (4,516)"
    keys: [topic_id]
    columns:
      - {name: domain_id, dtype: int32, meaning: null}
      - {name: domain_name, dtype: object, meaning: null}
      - {name: field_id, dtype: int32, meaning: null}
      - {name: field_name, dtype: object, meaning: null}
      - {name: subfield_id, dtype: int32, meaning: null}
      - {name: subfield_name, dtype: object, meaning: null}
      - {name: topic_id, dtype: object, meaning: "primary key"}
      - {name: topic_name, dtype: object, meaning: null}
      - {name: keywords, dtype: object, meaning: null}
      - {name: expansion_by_period, dtype: object, meaning: "list<double>; ACCORD per-period Expansion score series"}
      - {name: acceleration_by_period, dtype: object, meaning: "list<double>; ACCORD per-period Acceleration score series"}
      - {name: frontier_score_by_period, dtype: object, meaning: "list<double>; ACCORD per-period composite frontier score series"}
      - {name: expansion_latest, dtype: float32, meaning: "most recent period's Expansion score"}
      - {name: acceleration_latest, dtype: float32, meaning: "most recent period's Acceleration score"}
      - {name: frontier_score_latest, dtype: float32, meaning: "most recent period's composite frontier score; null for topics with is_frontier_scored=false"}
      - {name: quadrant, dtype: object, meaning: "{accelerating_expansion, accelerating_contraction, decelerating_expansion, decelerating_contraction}; null when not frontier-scored"}
      - {name: top25pct_frontier, dtype: boolean, meaning: "true iff frontier_score_latest is in the global top 25%; NULLABLE (pandas 'boolean', 810 nulls of 4,516) for topics without a frontier score -- 'unscored', not 'false'."}
      - {name: is_frontier_scored, dtype: bool, meaning: "non-nullable; false for the 811 excluded topics (frontier_excluded_share) and for any other topic lacking a score (frontier_unscored_share)"}
      - {name: exclusion_reason_code, dtype: object, meaning: "single-letter code (T/K/V/E/X/B/H/M/P/Y observed); non-null iff is_excluded=true (VERIFIED 2026-08-29: 811/811 excluded rows have a code, 0/3,705 non-excluded rows have one)"}
      - {name: exclusion_reason_label, dtype: object, meaning: "human-readable label for exclusion_reason_code"}
      - {name: is_excluded, dtype: bool, meaning: "the 811 catch-all exclusion list (DESIGN.md 811 references); COMPUTED count, never a typed constant in app code (L10) -- read as topics_dim.is_excluded.sum()"}
      - {name: exclusion_list_version, dtype: object, meaning: "single value shipped: '2026-08-21' (verified); the versioning DESIGN.md S4 requires for the 811 list"}
      - {name: review_status, dtype: object, meaning: "single value shipped: 'unreviewed'"}
      - {name: original_subfield_id, dtype: int16, meaning: "subfield assignment under the ORIGINAL taxonomy tree"}
      - {name: conservative_subfield_id, dtype: int16, meaning: "subfield assignment under the CONSERVATIVE tree"}
      - {name: bestfit_subfield_id, dtype: int16, meaning: "subfield assignment under the BESTFIT tree (shipped default)"}
      - {name: change_level, dtype: object, meaning: "{none, domain, subfield, field} -- how far the taxonomy repair moved this topic from its original OpenAlex placement"}
      - {name: fit_quality, dtype: object, meaning: "{no_fit, forced, fits}"}
      - {name: repair_status, dtype: object, meaning: "16 distinct adjudication-provenance values observed (e.g. changed_by_escalation, unchanged_confirmed, reverted_by_audit); taxonomy_repair_v1.3 audit trail"}

  # ============================================================================================
  # erc.parquet -- institution x ERC panel (28 panels)
  # ============================================================================================
  erc.parquet:
    grain: "institution x ERC panel (28 panels present, panel_idx 0..27); 211,596 rows (not all 7,557 x 28 -- sparse to nonzero-mass cells)"
    keys: [institution_id, panel_idx]
    columns:
      - {name: inst_key, dtype: int32, meaning: null}
      - {name: institution_id, dtype: object, meaning: null}
      - {name: panel_idx, dtype: int16, meaning: "0-based ERC panel index, 28 panels (SIRIS-Lab/erc-classifiers id2label); erc_tau=0.5 global threshold (config.yaml)"}
      - {name: share, dtype: float32, meaning: "mass / index.erc_classified_mass_frac for this institution. VERIFIED 2026-08-29: mass/share is a per-institution constant across all its panel rows and equals index.erc_classified_mass_frac exactly (e.g. 784.2579731515212). SINGLE-LABEL-DOMINANT: a work's ERC mass is fractional 1/n_panels across the panels it clears tau in (DESIGN.md S5), so Sigma(share) per institution is <= 1. VERIFIED: max Sigma(share) across all institutions = 1.0000001 (float32 rounding), min = 0.547."}
      - {name: mass, dtype: float32, meaning: "fractional work-mass classified into this ERC panel"}
      - {name: si, dtype: float32, meaning: "share / mean(share over institutions with nonzero mass in that panel). VERIFIED: 0 null values in the shipped 211,596 rows -- no floor observed on this column (contrast with subfields.si)."}

  # ============================================================================================
  # sdg.parquet -- institution x SDG (16 SDGs; dense, all 7,557 x 16)
  # ============================================================================================
  sdg.parquet:
    grain: "institution x SDG (16 SDGs); DENSE -- 120,912 rows = 7,557 institutions x 16, every institution has a row for every SDG even when share=0"
    keys: [institution_id, sdg_idx]
    columns:
      - {name: inst_key, dtype: int32, meaning: null}
      - {name: institution_id, dtype: object, meaning: null}
      - {name: sdg_idx, dtype: int16, meaning: "0-based SDG index, 16 values (SDG 17 not covered, DESIGN.md S5)"}
      - {name: share, dtype: float32, meaning: "MULTI-LABEL: mass / (index.sdg_tagged_share * index.sdg_eligible_mass_frac) for this institution -- denominator is the institution's SDG-TAGGED fractional mass, WINDOW = 2020-2025 (SDG mass basis, six-year) (window_conventions.sdg_mass_window -- build_sdg_table applies no year filter to the corpus it is handed, confirmed by sdg_year.parquet's own Sigma-over-6-years invariant below; NOT the 2020-2024 (core window) that intl_share/company_share use), VERIFIED exact 2026-08-29 (a work may carry several SDGs via 'any-keyword-hit', DESIGN.md S5). Invariant is 0 <= share <= 1 PER ROW (verified: range [0.0, 1.0] over all 120,912 rows), NOT Sigma<=1 -- Sigma per institution was observed up to 3.522568941116333 (verified max, 2026-08-29)."}
      - {name: esi, dtype: float32, meaning: "SDG specialisation index = institution SDG-tagged share / the Europe-wide average SDG-tagged share for that SDG, i.e. esi = share / europe_avg_tagged where europe_avg_tagged = SUM_index(sdg.mass) / SUM_index(sdg_tagged_share * sdg_eligible_mass_frac) -- the SDG-TAGGED-mass basis, per pipeline/agg/erc_sdg_long.py::build_sdg_long's own `europe_avg` line (mass.sum(axis=0) / tagged_mass.sum()). METHODS FLAG RESOLVED (2026-08-29, R-S5): source_manifest.json's esi_europe_avg_sdg_share_classified_mass_basis vector is a DIFFERENT, CLASSIFIED-mass-basis reference (SUM(sdg.mass) / SUM(index.sdg_classified_mass_frac)) -- naming this the esi denominator and dividing share by it understates the true divisor, overstating a naively-recomputed esi by a constant factor. VERIFIED NUMERICALLY: SUM_index(sdg_classified_mass_frac) / SUM_index(sdg_tagged_share * sdg_eligible_mass_frac) = 4.2046 (to 4 decimals; num=4,609,424.9308, den=1,096,285.9619, app/data/index.parquet, 2026-08-29) -- matches the ~4.2046x offset flagged at gate 2A exactly. The shipped esi column is unaffected (it was always computed on the tagged-mass basis by build_sdg_long, correctly); this entry now names esi's TRUE denominator instead of the manifest's classified-mass vector, closing BUILD_PLAN_2A.md L25's methods flag. esi/share is a constant, deterministic rescaling within each sdg_idx -- esi and share rank institutions identically within one SDG."}
      - {name: mass, dtype: float32, meaning: "fractional work-mass tagged with this SDG, WINDOW = 2020-2025 (SDG mass basis, six-year) (window_conventions.sdg_mass_window; a work's mass is NOT divided across its SDG tags -- it counts in full toward every SDG it is tagged with, which is why Sigma(mass) over an institution's 16 rows can exceed its tagged mass)"}

  # ============================================================================================
  # impact_cells.parquet -- institution x subfield x tree x floor (bootstrap PP cells)
  # ============================================================================================
  impact_cells.parquet:
    grain: "institution x subfield x tree x floor; 328,978 rows. Unlike fields/subfields, this table ships ALL THREE trees (verified: {bestfit, conservative, original} all present) and TWO floors (verified: {10, 30} present, config.yaml g6_impact_floor=30 default / g6_impact_floor_alt=10 information-only variant)."
    keys: [institution_id, subfield_id, tree, floor]
    columns:
      - {name: inst_key, dtype: int32, meaning: null}
      - {name: institution_id, dtype: object, meaning: null}
      - {name: subfield_id, dtype: int16, meaning: null}
      - {name: tree, dtype: category, meaning: "{bestfit, conservative, original} -- impact_cohort_tree in config.yaml is 'original' for the top-10% FLAG COMPUTATION regardless of selected tree (D6/R2.11); rolled up by the SELECTED tree's subfield for display. This table carries all 3 for that rollup."}
      - {name: floor, dtype: int16, meaning: "bootstrap-CI mass floor variant: 30 (shipped default, config.yaml g6_impact_floor) or 10 (information-only alternate, g6_impact_floor_alt)"}
      - {name: pp_top10_frac, dtype: float32, meaning: "PP(top10%) for this institution x subfield x tree x floor cell"}
      - {name: pp_ci_low, dtype: float32, meaning: "bootstrap 95% CI lower bound"}
      - {name: pp_ci_high, dtype: float32, meaning: "bootstrap 95% CI upper bound. VERIFIED 2026-08-29: pp_ci_low <= pp_top10_frac <= pp_ci_high holds for ALL 328,978 rows."}
      - {name: pp_denominator_frac, dtype: float32, meaning: "fractional-mass denominator (articles+reviews, 2020-2024) the pp_top10_frac cell was computed over"}
      - {name: n_works_full, dtype: int32, meaning: "full work count denominator for the same cell"}

  # ============================================================================================
  # sdg_fields.parquet -- institution x sdg x field x tree (NEW, 2B-R-P3, 2B-R-15/A7)
  # ============================================================================================
  sdg_fields.parquet:
    grain: "institution x sdg x field x tree (SDG-tagged mass depends on tree via the work's primary-topic field, so this is NOT bestfit-only like fields.parquet); 1,736,925 rows, sparse to nonzero cells. 7,556 of the 7,557 index institutions appear (I4210109597 has exactly 0.0 total SDG-tagged mass in sdg.parquet and correctly has no rows here -- VERIFIED 2026-08-30)."
    keys: [institution_id, sdg_idx, field_id, tree]
    columns:
      - {name: inst_key, dtype: int32, meaning: "join key to index.inst_key"}
      - {name: institution_id, dtype: object, meaning: null}
      - {name: sdg_idx, dtype: int16, meaning: "0-based SDG index, 16 values -- same convention as sdg.parquet.sdg_idx"}
      - {name: field_id, dtype: int16, meaning: "OpenAlex field id (topics_dim.field_id), OR the sentinel -1 for the 'untopiced' residual: a work carries SDG-tagged mass but no primary_topic_id (topics_ids empty on that work -- 0.138% of the 7,688,437-work corpus, VERIFIED 2026-08-30, matching A7's ~0.14% estimate). One explicit -1 row per (institution, sdg, tree) that has any untopiced tagged mass, never silently dropped or folded into a real field_id."}
      - {name: tree, dtype: category, meaning: "{bestfit, conservative, original} -- all 3 shipped (impact_cells.parquet precedent), since a work's field bucket (but never its SDG tag) can move between trees"}
      - {name: mass, dtype: float32, meaning: "fractional work-mass tagged with this SDG, attributed to this institution in this field (or the -1 residual), WINDOW = 2020-2025 (SDG mass basis, six-year) (window_conventions.sdg_mass_window) -- EXACT same tagging rule and window as sdg.parquet.mass (A7: enriched-corpus sdg_hits/sdg_eligible/sdg_classified flags, not the raw per-shard hits; a work's mass is NOT divided across multiple SDG tags, same as sdg.parquet). VERIFIED 2026-08-30: Sigma_field(mass) INCLUDING the -1 residual == sdg.parquet.mass for the SAME (institution_id, sdg_idx), independent of tree, on 20 random institutions x 16 SDGs x 3 trees (819 cells), max rel diff 1.176e-07 (tolerance 1e-4 relative, per 2B-R-15/A7)."}
    build_note: "pipeline/16_crosses.py --stage sdg, reusing pipeline/agg/trees_agg.py's NEW topic_to_taxon_maps(trees_df, 'field', subfield_field_map) (2B-R-15/A8) for the topic->field lookup per tree; the SDG-tagging explode itself (work_id -> sdg_idx) is a documented, invariant-checked reproduction of eu_enriched.py::build_sdg_table's own rule (that function returns only the institution-level wide table, never the per-work explosion this stream needs)."

  # ============================================================================================
  # sdg_year.parquet -- institution x sdg x year (NEW, 2B-R-P3, 2B-R-15/A7)
  # ============================================================================================
  sdg_year.parquet:
    grain: "institution x sdg x year (2020-2025, the FULL run window incl. the 2025 bonus year); 427,687 rows, sparse to nonzero cells. Tree-independent (SDG tagging has no tree dependency at all -- only sdg_fields's field bucket does)."
    keys: [institution_id, sdg_idx, year]
    columns:
      - {name: inst_key, dtype: int32, meaning: "join key to index.inst_key"}
      - {name: institution_id, dtype: object, meaning: null}
      - {name: sdg_idx, dtype: int16, meaning: "0-based SDG index, 16 values -- same convention as sdg.parquet.sdg_idx"}
      - {name: year, dtype: int16, meaning: "publication year, 2020-2025. 2025 is the labelled BONUS year (config.yaml bonus_year, same convention as topics_all.vol_full_2025/doctype_by_year) -- trends/volume only, no impact-indicator meaning here (SDG tagging carries no impact-window restriction to begin with)."}
      - {name: mass, dtype: float32, meaning: "fractional work-mass tagged with this SDG in this year, same tagging rule as sdg_fields.mass/sdg.parquet.mass; summed over ALL its years this table's mass basis is WINDOW = 2020-2025 (SDG mass basis, six-year) (window_conventions.sdg_mass_window). VERIFIED 2026-08-30 (2B-R-15/A7 invariant, resolved against the ACTUAL basis found, not assumed): Sigma_year OVER ALL 6 YEARS (2020-2025) == sdg.parquet.mass for the SAME (institution_id, sdg_idx), on ALL 104,854 shipped (institution,sdg) cells, max rel diff 1.192e-07 (tolerance 1e-4 relative) -- this CONFIRMS sdg.parquet's own mass basis is the full 2020-2025 (SDG mass basis, six-year) run window, NEVER the 2020-2024 (core window) (window_conventions.core_window) that intl_share/company_share use (build_sdg_table/build_erc_table apply no year filter to the corpus they are handed). Summing 2020-2024 ONLY is a strict subset (median 84.96% of the 6-year total on the same cells) -- NOT equal to sdg.parquet.mass; do not reconcile against it on a 5-year sum."}
    build_note: "pipeline/16_crosses.py --stage sdg; same work_id -> sdg_idx tagging explode as sdg_fields.parquet, grouped by publication_year instead of field."

  # ============================================================================================
  # impact_fields.parquet -- institution x field x tree x floor (NEW, 2B-R-P3, 2B-R-15/A8)
  # ============================================================================================
  impact_fields.parquet:
    grain: "institution x field (26) x tree x floor; 164,477 rows. Ships ALL THREE trees and TWO floors {10, 30}, same convention as impact_cells.parquet (subfield grain) -- this is the SAME per-work top-10% flag (decided once, in the work's ORIGINAL subfield x year x type cohort, D6/R2.11) rolled up to 26 fields instead of 252 subfields via trees_agg.py's NEW topic_to_taxon_maps(trees_df, 'field', subfield_field_map)."
    keys: [institution_id, field_id, tree, floor]
    columns:
      - {name: inst_key, dtype: int32, meaning: "join key to index.inst_key"}
      - {name: institution_id, dtype: object, meaning: null}
      - {name: field_id, dtype: int16, meaning: "OpenAlex field id (topics_dim.field_id); no -1 residual here (impact's D6 population is scoped to primary_subfield_id-thresholded works, which always resolve to a real field via the tree-independent subfield->field map, unlike sdg_fields's untopiced-work case)"}
      - {name: tree, dtype: category, meaning: "{bestfit, conservative, original} -- impact_cohort_tree in config.yaml is 'original' for the top-10% FLAG COMPUTATION regardless of selected tree (D6/R2.11); rolled up by the SELECTED tree's field for display. Same convention as impact_cells.parquet."}
      - {name: floor, dtype: int16, meaning: "bootstrap-CI mass floor variant: 30 (shipped default, config.yaml g6_impact_floor) or 10 (information-only alternate, g6_impact_floor_alt) -- same as impact_cells.parquet, though NO floor value was actually dropped by either variant at field grain in the shipped file (every candidate field cell's mass clears even the 30 floor, unlike the sparser subfield grain)"}
      - {name: pp_top10_frac, dtype: float32, meaning: "PP(top10%) for this institution x field x tree x floor cell -- same D6 definition as impact_cells.parquet.pp_top10_frac, rolled up to field grain"}
      - {name: pp_ci_low, dtype: float32, meaning: "bootstrap 95% CI lower bound (Poisson bootstrap, same machinery/n_reps=1000/seed=42 as impact_cells.parquet)"}
      - {name: pp_ci_high, dtype: float32, meaning: "bootstrap 95% CI upper bound"}
      - {name: pp_denominator_frac, dtype: float32, meaning: "fractional-mass denominator (articles+reviews, 2020-2024) the pp_top10_frac cell was computed over. VERIFIED 2026-08-30: for every (institution, field, tree, floor) cell, this is >= the MAX of its own child subfields' pp_denominator_frac in impact_cells.parquet (same institution/tree/floor) -- a field's covered mass is the SUM over its subfields' covered mass (nonnegative terms), checked on all 105,384 matched cells, 0 violations."}
      - {name: n_works_full, dtype: int32, meaning: "full work count denominator for the same cell"}
    build_note: "pipeline/16_crosses.py --stage impact-time (200-institution timed slice, extrapolated 38.6 min) then --stage impact (chunked 8x by institution, resumable per-chunk parquet checkpoints, actual wall time 44.6 min -- chunk cost is skewed by institution size, not uniform, because inst_key order is NOT random). VERIFIED 2026-08-30: (1) the EDITED impact_cells.build_impact_cells at its default grain='subfield' reproduces the SHIPPED impact_cells.parquet byte-identically (0.0 abs diff on every column) for 3 real institutions -- the P3 trees_agg.py/impact_cells.py edits are a pure additive generalisation, zero behaviour change at subfield grain; (2) an INDEPENDENT from-scratch recompute (separate code path, inline topic->field map, plain pandas groupby, no shared impact_cells.py/trees_agg.py machinery) of pp_top10_frac/pp_denominator_frac for 3 institutions matches the shipped values at max rel diff 3.6e-08 / 4.9e-08 (tolerance 1e-7); CI bounds are excluded from that independent check (Poisson bootstrap is stochastic across differing implementations by design)."

  # ============================================================================================
  # doctype_by_year.parquet -- institution x year x document type (NEW, R1 R-S5, BUILD_PLAN_2A L24)
  # ============================================================================================
  doctype_by_year.parquet:
    grain: "institution x year x document type, sparse to nonzero cells (institution population x 6 years {2020..2025} x up to 5 doc types; 141,182 rows, 1.0 MB, VERIFIED 2026-08-29). 2025 is the labelled BONUS year (config.yaml bonus_year, same convention as topics_all.vol_full_2025/vol_frac_2025): trends/volume only, excluded from impact indicators (R1.6 composition skew)."
    keys: [institution_id, year, doc_type]
    columns:
      - {name: inst_key, dtype: int32, meaning: "join key to index.inst_key (L14 population order)"}
      - {name: institution_id, dtype: object, meaning: "OpenAlex institution id; restricted to the 7,557 index institutions (app/data/index.parquet)"}
      - {name: year, dtype: int16, meaning: "publication year, 2020-2025"}
      - {name: doc_type, dtype: category, meaning: "OpenAlex `type_effective` (pipeline/agg/enriched_corpus.py) -- the harvest's own server-side type filter restricts this to {article, review, book, book-chapter, letter} (pipeline/01b_harvest_eu27_aug.py / 01_harvest_supplement.py `type:` filter, L23); VERIFIED 2026-08-29: exactly these 5 values observed across all 6 years, 0 other values."}
      - {name: vol_full, dtype: int32, meaning: "full (unfractionalized, head-count) work count in this institution x year x doc_type cell. Denominator note: SUM(vol_full) over doc_type for a given (institution, year) EQUALS index.vol_full_by_year_this_run's packed value for that year, EXACTLY (Class-1 invariant, BUILD_PLAN_2A L24; verified on all 7,557 x 6 = 45,342 institution x year cells, `pipeline/09c_doctype_by_year.py --check`)."}
      - {name: vol_frac, dtype: float32, meaning: "D5 fractional-counted work count (pipeline/agg/attribution.explode_fractional_weights) in this cell. Denominator note: SUM(vol_frac) over doc_type for a given (institution, year) equals index.vol_frac_by_year_this_run's packed value for that year within 1e-6 relative (1e-3 absolute for near-zero cells) -- verified on all 45,342 cells."}
    build_note: "pipeline/09c_doctype_by_year.py; SAME corpus loader (pipeline/agg/enriched_corpus.load_year_corpus, use_aug_harvest=True) and SAME attribution explode (pipeline/agg/attribution.explode_fractional_weights) as 09b_aggregate_eu.py's own year_vol/by_year block that produced index.vol_full_by_year_this_run/vol_frac_by_year_this_run -- this table is that same computation with one extra groupby key (type_effective), never a new opinion about what counts. Per-year checkpoints under data/artefacts_eu/_ckpt_doctype/ (resumable; the GLOBAL cross-year work_id dedup ~50 rows corpus-wide, keep-later-year -- is applied ONCE at final concatenation, matching 09b_aggregate_eu.py's own load_enriched_corpus_years, not per year)."

  # ============================================================================================
  # overrides/type_overrides.csv -- locked, append-only patch list (Annuaire pattern)
  # ============================================================================================
  overrides/type_overrides.csv:
    grain: "one row per institution whose displayed `type` differs from type_openalex; 41 rows, all locked=True (16 from gate rev 6 ruling 3 + 18 from the R2-T L28 scan, 2026-08-29 + 7 from the 2BR P4 gated-type resolution, 2026-08-30; 0 gated rows remain from any round -- see the `type_overrides:` block's stale_reference_note above for GATE.md's own now-superseded 'none applied' text)"
    keys: [institution_id]
    columns:
      - {name: institution_id, dtype: object, meaning: "must equal the index.institution_id values where type != type_openalex (str-cast), one-to-one; Class-1 identity invariant, test_contract.py reads the count from this file, not a typed literal"}
      - {name: display_name, dtype: object, meaning: null}
      - {name: country_code, dtype: object, meaning: null}
      - {name: type_openalex, dtype: object, meaning: "original OpenAlex type at the time of the override decision"}
      - {name: type_override, dtype: object, meaning: "the patched type applied to index.type"}
      - {name: evidence, dtype: object, meaning: "free-text evidence for the override decision"}
      - {name: source_url, dtype: object, meaning: null}
      - {name: decided_by, dtype: object, meaning: null}
      - {name: date, dtype: object, meaning: null}
      - {name: locked, dtype: bool, meaning: "true for all 41 shipped rows -- the file is append-only per the Annuaire pattern; a locked row is never edited in place"}

  # ============================================================================================
  # overrides/pool_exclusions.csv -- aspirational/lens CANDIDATE-POOL exclusion flags (NEW, 2BR
  # P4, R2-E, 2B-R-15/A6) -- feeds index.pool_excluded, never removes an index row
  # ============================================================================================
  overrides/pool_exclusions.csv:
    grain: "one row per institution_id flagged OUT of lens/aspirational candidate pools (wired in app/lib/engine); 3 rows. This file is the ONE thing index.pool_excluded means -- adding/removing a row here is the only way that column changes (Annuaire-pattern override list, same append-only convention as type_overrides.csv, though not yet marked locked=True per-row since R2-E is this stream's own first pass)."
    keys: [institution_id]
    columns:
      - {name: institution_id, dtype: object, meaning: "OpenAlex institution id flagged out of candidate pools; the 3 shipped values are I4210092262 (Romanian Ministry of Education), I4210164678 (Shell UK), I4210125590 (INESC) -- EXACTLY the institution_ids where index.pool_excluded is True (identity invariant, tests/test_contract_2br.py)"}
      - {name: canonical_id, dtype: object, meaning: "for a DUPLICATE-institution exclusion (Shell UK->I7923278 Shell NL, INESC->I121345201 INESC-ID), the surviving institution_id that keeps all the pair's mass under the A6 no-re-aggregation ruling; blank/NaN for the Romanian Ministry row (a funder-surfacing-as-performer case, not a duplicate -- it has no canonical counterpart, its row is excluded outright with nothing to redirect to)"}
      - {name: reason, dtype: object, meaning: "free-text justification, incl. the total_full_2020_2024 figures the canonical-id choice was made on (e.g. Shell UK 221 vs Shell NL 1135 -- the larger-volume id is always kept as canonical)"}
      - {name: source, dtype: object, meaning: "provenance stamp, e.g. 'GATE_2BR ruling 2026-08-30'"}

  # ============================================================================================
  # overrides/umbrella_supplement.csv -- named-umbrella supplement, ASCII-safe (created this stream)
  # ============================================================================================
  overrides/umbrella_supplement.csv:
    grain: "one row per named umbrella/aggregate institution resolved by badge_calibration.md's known-umbrella search; 24 rows"
    keys: [institution_id]
    columns:
      - {name: display_name, dtype: object, meaning: "well-known short/official name; NOT always identical to index.display_name (ASCII-transliterated -- accents stripped -- since this file is shipped ASCII-safe, not UTF-8; see app/docs/VENDORED.md for the choice)"}
      - {name: institution_id, dtype: object, meaning: "OpenAlex institution id; all 24 resolved (0 blank -- badge_calibration.json's known_umbrellas_found covers all 24, only Helmholtz Association, the 25th named umbrella, has no institution row and is omitted entirely, not shipped with a blank id)"}
      - {name: note, dtype: object, meaning: "empty for 18 rows; carries 'structurally unflaggable -- output attributed to child institutions' for the 3 structurally unflaggable names (Fraunhofer Society, Portuguese FCT, UKRI) per this stream's brief; carries a type-outside-automatic-gate note for AP-HP/Romanian Academy/Hungarian Research Network (their patched `type` is outside {government,funder,facility,nonprofit}, so only this supplement flags them); carries the 'debatable' caveat for Institut Pasteur (badge_calibration.md)."}

  # ============================================================================================
  # collab_pairs.parquet -- ALL a<b indexed institution pairs (NEW, 2BR P2, WT A1)
  # ============================================================================================
  collab_pairs.parquet:
    grain: "one row per unordered pair (a,b), a<b by institution_id string, BOTH indexed institutions with >=1 co-published work anywhere 2020-2025; 3,581,332 rows, 26.2 MB, zstd. NO FLOOR (WT A1 refutes the 2B-R-15 floor>=3 clause for this table specifically -- floor 1 fits comfortably inside the 95 MB/file cap). Universe = `openalex_eu27_aug` UNION `openalex_supplement` per year, eu27_aug canonical on id overlap (the exact rule `agg.enriched_corpus.load_year_corpus(use_aug_harvest=True)` uses; both source files are self-contained/schema-identical, `openalex_patch` is NOT part of this rule -- that file only serves the legacy April-vintage path, per `pipeline/02b_reconcile_corpus.py`'s own docstring)."
    keys: [a, b]
    columns:
      - {name: a, dtype: object, meaning: "institution_id, the lexicographically SMALLER of the pair's two ids (string compare, not ROR/numeric)"}
      - {name: b, dtype: object, meaning: "institution_id, the lexicographically LARGER of the pair's two ids"}
      - {name: copubs_2020, dtype: int32, meaning: "co-published works in 2020, full counting (a work with N indexed co-authoring institutions contributes 1 to EVERY pair among them, not fractionally split)"}
      - {name: copubs_2021, dtype: int32, meaning: null}
      - {name: copubs_2022, dtype: int32, meaning: null}
      - {name: copubs_2023, dtype: int32, meaning: null}
      - {name: copubs_2024, dtype: int32, meaning: null}
      - {name: copubs_2025, dtype: int32, meaning: "2025 bonus year (config.yaml bonus_year) -- included in copubs_total, not excluded the way impact indicators exclude it"}
      - {name: copubs_total, dtype: int32, meaning: "SUM(copubs_2020..copubs_2025); EXTERNAL checks (2BR P2 invariant f): (1) Strasbourg (I68947357) x CNRS (I1294671590) offline=12,691 vs live `lib.links.copubs_url(years=(2020,2025))`=12,692, Delta=1/12,692=0.008%; (2) CROSS-CLUSTER re-check after the universe fix, ETH Zurich (I35440088) x Strasbourg (I68947357) offline=541 vs live=541, Delta=0/541=0.000% (tolerance <=0.5%, WT A16)."}
      - {name: rank_in_a, dtype: int32, meaning: "dense rank (1=highest) of `b` among ALL of `a`'s partners by copubs_total, computed BEFORE any floor (2B-R-15); e.g. Strasbourg's #1 partner by copubs_total is CNRS."}
      - {name: rank_in_b, dtype: int32, meaning: "dense rank of `a` among ALL of `b`'s partners by copubs_total, same rule, `b`'s own perspective"}
    build_note: "pipeline/15_collab_pass.py; per-year checkpoints under data/interim/collab/ (pairs_YYYY.parquet); authorships_direct parsed per pipeline/agg/parsing.py::parse_authorships_direct (';' authors, '+' institutions per author), distinct institution ids per work intersected with index.parquet's 7,557 ids before itertools.combinations. Reads the eu27_aug+supplement UNION (see grain note) via `load_year_union()`, not eu27_aug alone."

  # ============================================================================================
  # collab_pair_topics.parquet -- top-100 joint topics per pair >= floor 5, + impact columns
  # (REGENERATED, 2B-R2-12/A2, stream P6, 2026-08-31 -- supersedes the 2B-R floor-3/top-20 build)
  # ============================================================================================
  collab_pair_topics.parquet:
    grain: "one row per (a, b, topic_id) for pairs with copubs_total >= 5 (2B-R2-12 floor, was 3 at 2B-R; read from the ALREADY-BUILT collab_pairs.parquet, not re-derived), TOP-100 topics per pair by vol_total (2B-R2 Sec 0 A3: floor 5 + top-100 fits at 78.7 MB once mean_citations is dropped -- see the mean_citations column note); 16,518,764 rows, 78.7 MB, zstd (hard cap 95 MB; rung2 of the size ladder -- rung1, top-100 + a quantised mean_citations column, measured 96.6 MB and breached the cap, P6 progress note). topic_id is the work's PRIMARY topic only (config.yaml assignment=primary, R2.18); topic->subfield for the impact join below is the BESTFIT tree ONLY (no tree-neutral subfield column exists on topics_dim, WT #8 -- disclosed here, not a per-tree column, which would triple row count for a secondary fact). Same eu27_aug+supplement UNION universe as collab_pairs."
    keys: [a, b, topic_id]
    columns:
      - {name: a, dtype: category, meaning: "institution_id, smaller of the pair (same a<b convention as collab_pairs)"}
      - {name: b, dtype: category, meaning: "institution_id, larger of the pair"}
      - {name: topic_id, dtype: category, meaning: "OpenAlex topic id (topics_dim.parquet); PRIMARY topic of the joint work only"}
      - {name: vol_w1, dtype: int16, meaning: "joint works with this primary topic, WINDOW = 2020-2022 (dynamics window 1, mean annual) (window_conventions.dynamics_window_1), full counting"}
      - {name: vol_w2, dtype: int16, meaning: "joint works with this primary topic, WINDOW = 2023-2024 (dynamics window 2, mean annual) (window_conventions.dynamics_window_2)"}
      - {name: vol_2025, dtype: int16, meaning: "joint works with this primary topic, 2025 bonus year"}
      - {name: vol_total, dtype: int16, meaning: "vol_w1+vol_w2+vol_2025; VERIFIED (2B-R2 P6): SUM(vol_total) over a pair's shipped topic rows is EXACTLY <= that pair's collab_pairs.copubs_total (0 violations on a 10,000-pair sample) -- equality except where the pair's topic diversity exceeds the top-100 cap."}
      - {name: sdg_tagged_n, dtype: int16, meaning: "of vol_total joint works with this primary topic, how many carry >=1 SDG keyword hit. Source: ALL `data/interim/sdg/sdg_shard_*.parquet` (same files sdg.parquet derives from), tagged = sdg_hits != '' on ANY shard row for that work_id (a deliberate simplification of `agg.enriched_corpus._load_sdg_hits`'s stricter uniqueness-asserting dedup -- see pipeline/15_collab_pass.py::load_sdg_tagged_lightweight docstring); does not need a canonical single hit-list, only a tagged/not-tagged boolean."}
      - {name: n_covered, dtype: int16, meaning: "ADDITIVE (2B-R2-12/A2, stream P6): of this row's joint works, WINDOW = 2020-2024 (core window), article+review only, non-retracted, how many fall in a (bestfit_subfield_id, year, type) cell that HAS a world threshold T (world_thresholds.parquet is null on ~24% of cells, WT #7 -- a cell with no T excludes its works from both n_covered and n_top10, same convention as agg/impact.py's pp_covered/pp_uncovered). ALWAYS divide n_top10 by n_covered, never by vol_total (that mixes windows/types and undercounts by 20-40%, WT #7). VERIFIED (2B-R2 P6): n_top10 <= n_covered <= vol_total on every one of the 16,518,764 shipped rows, 0 violations; volume-weighted coverage Sum(n_covered)/Sum(vol_w1+vol_w2) = 98.4% (higher than the raw 76% cell-coverage rate because joint works cluster in the larger, more-often-covered cells)."}
      - {name: n_top10, dtype: int16, meaning: "ADDITIVE (2B-R2-12/A2, stream P6): of n_covered, how many have cited_by_count >= T (the world subfield x year x type top-10% cutoff) -- EXACT SAME comparison convention as `agg/impact.py::join_thresholds`'s `pp_hit` (>=, not >). Citation percentile stats are NOT computable (world_thresholds.parquet ships one p90 cutoff per cell, no percentile grid, WT #6) -- this count + n_covered is the shipped fallback, per 2B-R2 Sec 0 A2. Independently re-verified via a from-scratch second code path for Strasbourg x CNRS's largest joint field (P6 progress note): exact match."}
      - {name: erc_top_panel, dtype: category, meaning: "PAIR-LEVEL (repeated on every one of the pair's shipped topic rows, not per-topic): the ERC panel_idx (app/lib/engine/resources/erc_panels.csv) most frequently the work-level argmax(probs) among ALL of the pair's joint works (any primary topic, not just this row's), restricted to works with an erc_probs.parquet row. Source: `pipeline/agg/enriched_corpus._load_erc_probs` (consolidated erc_probs.parquet + erc_probs_delta_oa.parquet, 7,921,706 distinct work_ids, WT #19)."}
      - {name: erc_top_panel_n, dtype: int16, meaning: "PAIR-LEVEL: count of the pair's labelled joint works landing on erc_top_panel (the mode)"}
      - {name: erc_labelled_n, dtype: int32, meaning: "PAIR-LEVEL labelled-denominator (2BR A9): count of the pair's joint works (any topic) with an erc_probs row at all -- corpus-wide coverage is 89.57% (WT #19), so erc_top_panel_n/erc_labelled_n is 'of the labelled works', never divide by copubs_total. Widened from int16 to int32 at the floor-5/top-100 regen (2B-R2 P6): the wider qualifying-pair set pushes some pairs' labelled-work counts past 32,767."}
    dropped_column: "mean_citations (mean cited_by_count over ALL the row's joint works 2020-24, any type/retraction -- denominator vol_w1+vol_w2) was BUILT and MEASURED but is NOT shipped on this table: at top-100 it is the single biggest size lever (rung1, quantised to the smallest safe nullable int width, measured 96.6 MB vs the 95 MB cap -- real data has a citation tail past int16's 32,767, so the column cannot even get the full 2-byte win) and dropping it is what fits floor-5/top-100 at all (rung2, 78.7 MB). It IS shipped on collab_pair_fields.parquet below (uncapped rows, one value per pair x field, far fewer rows)."
    build_note: "pipeline/15_collab_pass.py's P6 extension (`run_p6`/`stage_p6_year`/`combine_p6_topics`/`write_p6_topics`); NEW per-year checkpoints under data/interim/collab_p6/ (topics_YYYY.parquet, erc_pair_YYYY.parquet, fields_YYYY.parquet -- separate from the original 2B-R collab/ checkpoint dir so the two floors/caps never collide); qualifying pairs read from the SHIPPED collab_pairs.parquet (unchanged by this stream) filtered to copubs_total>=5, not re-derived from stage1. Topic/ERC/impact columns combined across years, THEN top-100-per-pair truncation by vol_total, THEN sorted (a,b,topic_id) for compression."

  # ============================================================================================
  # collab_pair_fields.parquet -- pair x field, uncapped, BESTFIT tree only
  # (NEW, 2B-R2-12/A3, stream P6, 2026-08-31)
  # ============================================================================================
  collab_pair_fields.parquet:
    grain: "one row per (a, b, field_id) for pairs with copubs_total >= 5 (same floor and qualifying-pair set as collab_pair_topics.parquet), UNCAPPED (every field the pair has any joint mass in, not top-N) -- a pair typically spans ~4 distinct fields (mean 4.06, WT #13), far fewer than its topic diversity, so no per-pair cap is needed to hit the size budget. BESTFIT tree ONLY (2B-R2 Sec 0 A3: shipping all 3 trees measured 104.7 MB alone and would push app/data to ~295 MB against the 250 MB budget, WT #13) -- the field-breakdown chart this feeds states 'repaired (best-fit) taxonomy' and does not react to a tree toggle. 4,375,728 rows, 28.3 MB, zstd. Same eu27_aug+supplement UNION universe as collab_pairs/collab_pair_topics."
    keys: [a, b, field_id]
    columns:
      - {name: a, dtype: category, meaning: "institution_id, smaller of the pair (same a<b convention as collab_pairs)"}
      - {name: b, dtype: category, meaning: "institution_id, larger of the pair"}
      - {name: field_id, dtype: int16, meaning: "OpenAlex field id (topics_dim.field_id), reached via each joint work's PRIMARY topic -> BESTFIT subfield -> field (subfield->field nesting is tree-independent, pipeline/agg/trees_agg.py's own documented invariant)"}
      - {name: vol_w1, dtype: int16, meaning: "joint works with primary topic in this field, WINDOW = 2020-2022 (dynamics window 1, mean annual) (window_conventions.dynamics_window_1), full counting"}
      - {name: vol_w2, dtype: int16, meaning: "joint works with primary topic in this field, WINDOW = 2023-2024 (dynamics window 2, mean annual) (window_conventions.dynamics_window_2)"}
      - {name: vol_2025, dtype: int16, meaning: "joint works with primary topic in this field, 2025 bonus year"}
      - {name: vol_total, dtype: int16, meaning: "vol_w1+vol_w2+vol_2025. VERIFIED (2B-R2 P6): equals SUM(collab_pair_topics.vol_total) over the SAME pair's UNCAPPED topic rows rolled up to this field, on the 5 largest pairs by volume (max abs diff 0.0, independent recompute) -- note this checks against the uncapped topic set, not the shipped (top-100-capped) collab_pair_topics.parquet, whose per-field sum can be lower for a pair with more than 100 distinct topics."}
      - {name: n_covered, dtype: int16, meaning: "same D6 population and (bestfit_subfield_id, year, type) threshold-coverage rule as collab_pair_topics.n_covered, rolled up to field grain. VERIFIED: n_top10 <= n_covered <= vol_total on all 4,375,728 rows, 0 violations; volume-weighted coverage Sum(n_covered)/Sum(vol_w1+vol_w2) = 98.3%."}
      - {name: n_top10, dtype: int16, meaning: "same convention as collab_pair_topics.n_top10 (cited_by_count >= T, of n_covered), rolled up to field grain. Independently re-verified via a from-scratch second code path for Strasbourg (I68947357) x CNRS (I1294671590) x field_id=31 (their largest joint field, vol_total=1,882): n_top10=383, n_covered=1,642, vol_total=1,882 -- exact match on all three against the shipped row (P6 progress note, pipeline/agg/impact.py's join_thresholds NOT imported by that check, a genuinely separate parse+join)."}
      - {name: mean_citations, dtype: Int32, meaning: "mean cited_by_count over ALL this row's joint works WINDOW = 2020-2024 (any type, any retraction status -- denominator = vol_w1+vol_w2, NOT n_covered), rounded to nearest int. Nullable (NA when vol_w1+vol_w2==0, i.e. the field's joint mass is 2025-only). Int32 rather than the ladder's literal 'Int16' target: real data has a citation tail past 32,767 on a small number of rows (270/16.1M at topic grain) that would silently overflow a true int16 -- kept exact here since this uncapped, far-smaller table has size headroom, unlike collab_pair_topics.parquet where the same column was dropped entirely to fit the 95 MB cap (see that file's dropped_column note)."}
    build_note: "pipeline/15_collab_pass.py's P6 extension (`stage_p6_year`'s field-level accumulation runs in the SAME per-work loop as the topic-level one, so both tables share one pass over the raw corpus); combined via `combine_p6_fields`/written via `write_p6_fields`; per-year checkpoints under data/interim/collab_p6/fields_YYYY.parquet."

# ================================================================================================
# derived_views -- computed live in-app from the files above, not shipped as files. Listed here
# because the contract between what the data supports and what the UI may claim runs through
# these definitions; every denominator below is either verified against the shipped columns
# (this stream) or traced to a BUILD_PLAN/SPEC ruling id.
# ================================================================================================
derived_views:

  per_scenario_fields_subfields:
    what: "fields/subfields shapes for tree in {original, conservative, bestfit} x basis in {frac, full}, other than the shipped (bestfit, frac) pair"
    how: "pipeline/agg/derive.py:derive_shapes(topics_all, topics_dim, tree, basis) over the shipped topics_all/topics_dim (the one topic-grain master, R2 S2)"
    denominator: "same as the shipped fields/subfields share_frac/share_full (Sigma=1 per institution per scenario); basis='full' si = share_full / mean(share_full over nonzero institutions) -- a DOCUMENTED judgment call (derive.py 'BASIS GENERALIZATION'), not itself present in any shipped table for cross-check. The G6 floor test always reads vol_frac regardless of displayed basis (derive.py 'MEAN-SHARE POPULATION')."

  lens_score_tables:
    what: "L0/L1/L3/F1/L2f/L4/L5/L6(/C1/L7) ranked score tables per seed institution"
    how: "app/lib/engine (Stream B); L1/L3/F1/L2f/L4/L5/L6 read fields/subfields/topics_all/erc/sdg; L0 reads fields; score forms: weighted Jaccard / histogram-intersection (Sigma-min) / excess-profile overlap depending on lens (Method B continuous form, spec_theta=1.5, config.yaml)"
    denominator: "'% of portfolio in common' = the Sigma-min histogram intersection of the two institutions' share vectors in the lens's grain (fields/subfields/topics/ERC-panels/SDGs) under the active scenario; excess-profile overlaps (L2f/L5/L7) additionally floor out cells below their eligibility floor before comparing (L2f: G6 vol_frac>=30 on subfields.si's own floor; L5/L7: erc.si/no-floor-observed and sdg-derived, respectively)."

  concordance:
    what: "found in the top-N of k of n lenses defined for this seed"
    rule: "N=30 (config.yaml proposal_r5.concordance_N, M5.5), n = enabled DEFAULT lenses (L0,L1,L3,F1,L2f,L4,L5,L6 = 8 by default; C1/L7 excluded from n unless the user enables them, L1 in BUILD_PLAN); k/n computed on the UNFILTERED rankings -- post-filters remove rows from the overview display and NEVER recompute k (L6 in BUILD_PLAN); ties share the rank, top-N cut includes every entry tied at the cut (L9), never padded when fewer than N nonzero candidates exist."

  aspirational:
    what: "L1 top-50 (tie-inclusive) pool filtered to pp_top10_frac > seed's pp_top10_frac AND pp_ci_low > seed's pp_ci_high (both from index.parquet), kept in L1-overlap order"
    how: "evals/campaign_v2/gen_lists_v2.build_aspirational_v2 (L4 in BUILD_PLAN); intervals rendered, not just point estimates; a PP-sort is a UI option, never the default"

  seed_card:
    fields: "type + type-corrected badge, umbrella badge, country, size (total_full_2020_2024 + total_frac_2020_2024), hhi_class, top fields (shape_field_bestfit, top-3), top subfields (subfields.parquet, top-5 by share_frac at the default scenario), evidence lines (n_eligible_subfields for L2f = count of this institution's subfields with vol_frac>=30; sdg_tagged_share; erc_classified_mass_frac/total_frac_2020_2024; frontier_top25_share; frontier_excluded_share as the catch-all/811 tooltip), pp_top10_frac with pp_ci_low/pp_ci_high, OpenAlex works link (authorships.institutions.id:<id>,publication_year:2020-2024), ROR link, homepage_url"

  umbrella_badge:
    rule: "type ∈ {government, funder, facility, nonprofit} (on the PATCHED index.type, never type_openalex) AND total_full_2020_2024 > 5x the country x type median (median computed live, over the index, on the SAME patched type column) -- config.yaml proposal_r5.umbrella_badge, multiplier=5, reference=country_type_median."
    supplement: "UNION with overrides/umbrella_supplement.csv's 24 institution_ids, REGARDLESS of the rule above -- 3 of the 24 (AP-HP, Romanian Academy, Hungarian Research Network) carry a patched type OUTSIDE {government,funder,facility,nonprofit} and would never satisfy the automatic rule; the supplement is how they are still flagged."
    disclosure: "never both the umbrella badge and the type-corrected badge on one row (WT #14, BUILD_PLAN L7) -- checked because both badges read the PATCHED type, so a type-corrected education institution can never also be an umbrella candidate under this rule."

  scale_guard_ratio:
    formula: "max(seed.total_full_2020_2024, candidate.total_full_2020_2024) / min(...) <= m"
    m: "8 when the SMALLER of the pair is below 20,000 full works; 4 when it is >= 20,000 (config.yaml proposal_r5.scale_guard, M5.6/H15; band-differentiated, a single x5 is NOT band-safe)"

  concordance_denominator_disclosure: "the overview caption states N (=30) and n (count of enabled default lenses) explicitly on every render (L3 in BUILD_PLAN) -- never a bare k/n fraction without both numbers spelled out"

  # ---- Refinement R2 (2026-08-29): derived views added by stream R2-P (text supplied in progress/R2_P.md, applied by the manager) ----
  baselines_r2:
    what: "Whole-index median + percentile rank for 8 KPIs, computed live by app/lib/baselines.py::build(index.parquet) and cache_resource'd by the page -- NOT a shipped table (R2 L31)."
    kpis: [total_full_2020_2024, total_frac_2020_2024, hhi_subfield, breadth_subfields, sdg_tagged_share, frontier_top25_share, pp_top10_frac, bonus_year_full]
    bonus_year_full: "vol_full_by_year_this_run's entry for config.yaml's bonus_year (2025 as shipped), parsed at call time -- not a column."
    percentile_definition: "share of non-null index.parquet values STRICTLY BELOW the institution's own value (0..1); None when the institution's own value is null. Population = institutions with a non-null value for that KPI. The index is dominated by small specialised institutes (median 572 full publications, median breadth 1 subfield at the G6 floor), so the median is a population fact, not a norm -- the UI says so (copy BASELINE_HELP)."
  si_status_r2:
    what: "{solid, thin, none} added to subfields_table/erc_table/sdg_table/fields_table (app/lib/profile_data.py) -- a PROFILE-DISPLAY floor (R2 L34), separate from the ratified G6 lens floor in derive.py (same 30, different purpose, both in force)."
    subfields: "solid: vol_frac >= 30; thin: 10 <= vol_frac < 30; none: vol_frac < 10."
    erc_sdg: "same thresholds on the fractional `mass` column (never on share/si/esi); sdg.parquet is dense, so 'none' genuinely occurs there (zero-mass rows carry no SI mark -- the ERC/SDG zero-volume fix)."
    fields: "solid when vol_frac > 0 and si is not null, else none; fields.si carries no floor, so 'thin' cannot occur at field grain."
    subfields_si_value: "subfields_table's si is RECOMPUTED unfloored (share / mean(share over the rows present in the scenario frame for that subfield) -- derive.py's own mean_share_v population and formula, minus its G6 gate) so a thin row carries a real value; wherever subfields.parquet's floored si is defined the recomputed value equals it within float32 rounding (tests/test_profile_data.py, rtol 1e-5). erc.si and sdg.esi are not recomputed (no floor shipped)."
  rank_volume_r2:
    what: "topics_table gains a 1..n rank by volume on the CURRENT basis (vol_full if basis == full else vol_frac), unique, ties by topic_id -- feeds the frontier panel's 'top N topics by volume' mode (R2 L33); top25pct_frontier is unrelated and not a subset."
  sdg_label_numbered_r2:
    what: "resources/sdg_labels.csv and sdg_table gain sdg_label_numbered = 'SDG {n} · {label}' (R2 L36); sdg_label kept alongside."

  # ---- 2B-R (2026-08-30): dynamics windows pre-declared for CD before compare_data/views_compare exist ----
  dynamics_2br:
    what: "compare_data.metric_frame(metric='dynamics', ...) -- Compare's 'Dynamics Δ' metric (2B-R-6): % change between two mean-annual-volume windows. Compare-only; never shown on Find."
    windows: "dynamics_window_1 = 2020-2022 (dynamics window 1, mean annual) (3 years); dynamics_window_2 = 2023-2024 (dynamics window 2, mean annual) (2 years) -- window_conventions above, both named verbatim wherever this metric is surfaced (contract, UI, Methods, per BUILD_PLAN_2BR.md 2B-R-6). 2025 (bonus year) EXCLUDED from both windows, same rule as every impact-adjacent window in this contract."
    formula: "mean_annual_w1 = SUM(vol_<year> for year in 2020,2021,2022) / 3; mean_annual_w2 = SUM(vol_<year> for year in 2023,2024) / 2; dynamics = (mean_annual_w2 - mean_annual_w1) / mean_annual_w1. 0-SAFE GUARD (Class-1 CD invariant): when mean_annual_w1 == 0 the result is None/n-a, NEVER a divide-by-zero, an inf, or a silently-rendered NaN -- ties into the house digit-ban rule that n/a is never printed as 0."
    source_by_level:
      field: "topics_all.parquet's vol_full_<year>/vol_frac_<year> columns (2020-2024 present per-topic; 2025 also present but excluded by this metric's own rule), rolled up via topics_dim.field_id -- field-level BY-YEAR volume is otherwise NOT shipped (fields.parquet carries no by-year columns, see topics_all.parquet's trend_slices note), so this metric's field-level values are always derived from topics_all, never from fields.parquet directly."
      subfield: "same topics_all.parquet columns, rolled up via topics_dim.subfield_id."
      sdg: "sdg_year.parquet (NEW, 2BR P3): institution x sdg x year mass, WINDOW = 2020-2025 (SDG mass basis, six-year) shipped in full; CD sums only its 2020-2022/2023-2024 rows for this metric (a strict subset of the shipped window, same 0-safe rule), ignoring the shipped 2025 row -- this metric's own window pair is unrelated to and narrower than sdg_year's storage window, never conflate the two."
      erc: "NOT DERIVABLE from any shipped table -- erc.parquet is whole-window only, no by-year ERC table exists. compare_data.metric_frame(metric='dynamics', level='erc') returns the typed empty + reason 'no by-year ERC data shipped' per the CD interface contract (BUILD_PLAN_2BR.md Sec 4) -- the UI hides this option, it never renders a wrong or zero value."
      pair_topics_collaborate: "collab_pair_topics.parquet (Collaborate, not Compare) ships vol_w1/vol_w2 PRE-aggregated to these exact two windows already (2BR P2) -- Collaborate reads them directly and does not recompute from topics_all; the window definitions are identical (dynamics_window_1/2 above), only the consuming page differs."
