# app/config.yaml -- FLAT app config resolved from V3/config/config.yaml (proposal_r5 block,
# ratified at GATE_MEMO_rev6.md). Every key below carries a one-line comment naming the ruling
# id it traces to (BUILD_PLAN_2A.md Stream A build step 3). No value is invented here: a key
# not present in V3/config/config.yaml or BUILD_PLAN_2A.md is left out of this file.
# Loaded by lib/app_config.py into CFG (dict) -- nothing else reads V3/config/config.yaml at
# app runtime (standalone principle, CLAUDE.md).

lenses:
  default: [L0, L1, L3, F1, L2f, L4, L5, L6]  # proposal_r5.lenses.shown, M5.1 -- L0 field-grain reinstated as 8th default lens
  optional: [C1, L7]                          # proposal_r5.lenses.optional, M5.2 -- both off by default (C1: S1.8; L7 reinstated with a "mostly noise" warning)

depth:
  default: 30  # proposal_r5.depth.default, M5.5 -- union@20/@50 = 0.79 (below H9's 0.90 bar); judges' median recommended_depth = 30
  max: 50      # proposal_r5.depth.max_one_click, M5.5/H9 fallback rule -- one click away from 30, never the default

concordance_N: 30  # proposal_r5.concordance_N, M5.5 -- supersedes R2.24 #8b's 20; matches the new depth default

scenario:
  tree_default: bestfit  # config.yaml scenario.tree_default, R2.20
  basis_default: frac    # config.yaml scenario.basis_default, R2.20 (D5)
  toggles:
    tree: [original, conservative, bestfit]  # config.yaml scenario.toggles.tree / taxonomy.trees, R2.11
    basis: [frac, full]                      # proposal_r4.scenarios.toggles, R4.5 -- the 811 toggle is REMOVED, not a third basis value

scale_guard:
  lt_20k: 8                     # proposal_r5.scale_guard.lt_20k_works, M5.6/H15 -- a single x5 multiplier is not band-safe
  ge_20k: 4                     # proposal_r5.scale_guard.ge_20k_works, M5.6/H15
  band_threshold_works: 20000   # proposal_r5.scale_guard band split point (lt_20k vs ge_20k), M5.6/H15

umbrella_badge:
  types: [government, funder, facility, nonprofit]  # proposal_r5.umbrella_badge.types, M5.7 -- widened from proposal_r4's {government, funder}
  multiplier: 5                                      # proposal_r5.umbrella_badge.multiplier, unchanged from proposal_r4 -- best zero-FP tradeoff at ~68% coverage
  reference: country_type_median                     # proposal_r5.umbrella_badge.reference, kept for continuity with proposal_r4
  basis_column: type  # patched type, BUILD_PLAN L7 -- never type_openalex (WT #14: that basis flags Sciences Po, CentraleSupelec, EHESS)

family_filter_threshold: 0.7  # config.yaml family_filter_threshold, R2.24 #8c -- opt-in post-filter per proposal_r5.family_filter, M5.12/gate rev 6 ruling 4

type_overrides:
  file: data/overrides/type_overrides.csv                     # proposal_r5.type_overrides.file, M5.8/H13 -- 16 applied, 0 gated (BUILD_PLAN_2A.md L15)
  ui_badge: "type corrected by SIRIS (was: {type_openalex})"  # proposal_r5.type_overrides.ui_badge

window: [2020, 2024]  # config.yaml window_analytical, D1 -- analytical window for impact/shape indicators
bonus_year: 2025       # config.yaml bonus_year, D1 -- trends/volume only, reported but excluded from impact

perimeter_countries: [at, be, bg, hr, cy, cz, dk, ee, fi, fr, de, gr, hu, ie, it, lv, lt, lu, mt, nl, pl, pt, ro, sk, si, es, se, gb, ch, "no", is]  # config.yaml perimeter_countries, R2.3/D10 -- EU27 + GB/CH/NO/IS

snapshot: august_2026  # config.yaml snapshot, R2.1 -- single-vintage reference corpus

g6_floor: 30  # config.yaml g6_impact_floor, R2.6/R2.24 #8d -- impact-cell bootstrap-CI floor (fractional mass); verdict unchanged at r2

l2f_floor:
  value: 30            # proposal_r4.l2_si_floor.value, GATE_MEMO_rev3 S7 candidate (f)
  basis: paper_count   # proposal_r4.l2_si_floor.basis, candidate (f) -- SEMANTICS CHANGE: replaces the shipped fractional-mass floor

erc_tau: 0.5  # config.yaml erc_tau, R2.23 -- global; per-panel exception considered and rejected

corpus_types: [article, review, book, book-chapter, letter]  # harvest server-side filter, pipeline/01b_harvest_eu27_aug.py lines 10-14; L23
openalex_filters: {has_doi: true}  # same harvest filter; L23

basket_cap: 6  # BUILD_PLAN_2B.md decision 2B-8/2B-1 -- Compare is 2-6 institutions; additive key, Stream S (config.yaml otherwise unowned in 2B)
compare_cap: 3  # BUILD_PLAN_2BR.md decision 2B-R-4/A13 -- Compare itself is capped at 3, hard; basket_cap (6) stays the shortlist cap, unchanged

# Facts the Methods page states whose SOURCE lives outside this repo (manager, 2B, 2026-08-29):
# each value is copied here with its provenance so the page never types a number (L10) and
# never renders n/a for a known fact. Update when the source changes.
methods_facts:
  n_gated: 0                        # CORRECTED 2026-08-30 (2BR, stream MU, self-corrected after a first pass wrongly read WT A5 as "4 still unresolved"): docs/data_contract.yaml's own type_overrides.n_ids grain note is explicit, "0 gated rows remain from any round". 2B-R-3 applied all 7 rows of type_overrides_GATE_R2.md (CNR, TNO, VTT, DZHK, DZNE, DZL, DZIF); the 4 rows of the OLDER type_overrides_GATE.md (NLDA, MAL, FUNIBER, IMT) were ALREADY resolved at gate rev 6 (2026-08-28, predating 2B-R), verified live in type_overrides.csv (decided_by "user ruling via manager, gate rev 6") -- WT A5's "the R1 gate's four still-gated ids STAY gated" means their gate-rev-6 resolution stands unchanged this round, not that they remain unapplied. Both GATE .md files are historical records only (contract stale_reference_note); type_overrides.csv is the one source of truth
  aspirational_seeds: 8             # V3/evals/aspirational_R2/results.json seed count
  aspirational_definitions: 6       # V3/evals/aspirational_R2/REPORT.md §1 (V0, A-size, A-impact+size, A-frontier, A-complement, A-combined)
  external_peers_unfound: 26        # INDICATOR_SPEC_v2.md §8 recall ceiling (N's source table, progress/2B_N.md §2)
  intl_company_n_ids: 74899         # 2BR P1 (V3/pipeline/14_fetch_inst_meta.py): distinct authorship ids pulled from OpenAlex (missing from index/master), manager read-back of the run, BUILD_PLAN_2BR.md §7 P1 row; the interim output (data/interim/inst_meta_all.parquet) is not shipped to app/, so this count has no CFG/manifest home of its own
  intl_company_pct_resolved: 99.81  # same P1 run: share of the pulled ids OpenAlex resolved to a country_code/type (coverage 99.83% of authorship instances, per-id resolution 99.81%, BUILD_PLAN_2BR.md §7 P1 row); the 1-2% unresolved are "resolved-unknown", counted, never treated as zero (WT A4)
  impact_ci_coverage_pct: 95        # V3/pipeline/agg/impact.py::poisson_bootstrap_ci_vectorized, default alpha=0.05, NEVER overridden at any call site (grepped 2026-08-30 across 16_crosses.py, 09b_aggregate_eu.py, agg/eu_enriched.py -- all pass only n_reps/seed) -> two-sided percentile interval width 100*(1-alpha). pipeline/ sits outside the app/ repo (standalone principle), so this is a manager-verified fact, not live-computed; tests/test_pages_methods.py re-derives it from impact.py directly as a drift guard
